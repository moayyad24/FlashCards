name: cardy
description: "Cardy is a Flashcards application"

publish_to: "none"

version: 1.0.6+6

environment:
  sdk: ">=3.4.1 <4.0.0"

dependencies:
  another_flushbar: ^2.2.4
  archive: ^4.0.9
  cupertino_icons: ^1.0.6
  device_preview: ^1.3.1
  file_picker: ^11.0.2
  flare_flutter: ^3.0.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_colorpicker: ^1.1.0
  flutter_iconpicker: ^4.0.3
  flutter_screenutil: ^5.9.3
  fluttertoast: ^8.2.8
  get_it: ^9.2.1
  google_mobile_ads: ^8.0.0
  flutter_dotenv: ^6.0.1
  logger: ^2.7.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  sqflite: ^2.4.2+1
  syncfusion_flutter_gauges: 33.2.6
  upgrader: ^13.3.0
  get: ^4.7.3
  share_plus: ^12.0.2

dev_dependencies:
  change_app_package_name: ^1.4.0
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/flare/
    - assets/images/
    - assets/gif/

flutter_native_splash:
  color: "#070628"
  image: assets/images/app_icon.png

  android_12:
    color: "#070628"
    image: assets/images/android_12_icon.png

  fullscreen: true
  android: true
  ios: true
